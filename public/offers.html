<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>العروض والباقات - Nature Secrets</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <img
        src="images/logo.jpg"
        alt="Nature Secrets Logo"
    >

    <h1>العروض</h1>


    <!-- ============================== -->
    <!-- BACK TO HOME -->
    <!-- ============================== -->

    <button id="home-button">
        العودة إلى الصفحة الرئيسية
    </button>


    <!-- ============================== -->
    <!-- CATEGORY NAVIGATION -->
    <!-- ============================== -->

    <button
        class="category-button"
        onclick="location.href='#hair-loss-dandruff'">
        علاج التساقط والقشرة والإنبات
    </button>

    <button
        class="category-button"
        onclick="location.href='#sensitive-dry-normal-skin'">
        البشرة الحساسة والجافة والعادية
    </button>

    <button
        class="category-button"
        onclick="location.href='#oily-skin'">
        البشرة الدهنية
    </button>

    <button
        class="category-button"
        onclick="location.href='#hair-care'">
        العناية بالشعر
    </button>

    <button
        class="category-button"
        onclick="location.href='#optional-additions'">
        الإضافات الاختيارية
    </button>

    <button
        class="category-button"
        onclick="location.href='#special-offers'">
        العروض الخاصة
    </button>


    <!-- ============================== -->
    <!-- CATEGORY 1 -->
    <!-- ============================== -->

    <section id="hair-loss-dandruff">

        <h2>
            مجموعات علاج التساقط والقشرة والإنبات
        </h2>

        <!--
            ALL SUPABASE OFFERS GO HERE
            offers.js loads them automatically.
        -->

        <div id="hair-loss-bundles-container"></div>

    </section>


    <!-- ============================== -->
    <!-- CATEGORY 2 -->
    <!-- ============================== -->

    <section id="sensitive-dry-normal-skin">

        <h2>
            مجموعات العناية بالبشرة الحساسة والجافة والعادية
        </h2>

        <!--
            ALL SUPABASE OFFERS GO HERE
        -->

        <div id="sensitive-skin-bundles-container"></div>

    </section>


    <!-- ============================== -->
    <!-- CATEGORY 3 -->
    <!-- ============================== -->

    <section id="oily-skin">

        <h2>
            مجموعات العناية بالبشرة الدهنية
        </h2>

        <!--
            ALL SUPABASE OFFERS GO HERE
        -->

        <div id="oily-skin-bundles-container"></div>

    </section>


    <!-- ============================== -->
    <!-- CATEGORY 4 -->
    <!-- ============================== -->

    <section id="hair-care">

        <h2>
            مجموعات العناية بالشعر
        </h2>

        <!--
            ALL SUPABASE OFFERS GO HERE
        -->

        <div id="hair-care-bundles-container"></div>

    </section>


    <!-- ============================== -->
    <!-- OPTIONAL ADDITIONS -->
    <!-- ============================== -->

    <section id="optional-additions">

        <h2>
            الإضافات الاختيارية
        </h2>

        <!--
            OFFERS CREATED FROM ADMIN PANEL
            WITH CATEGORY optional-additions
            WILL APPEAR HERE.
        -->

        <div id="optional-additions-container"></div>

    </section>


    <!-- ============================== -->
    <!-- SPECIAL OFFERS -->
    <!-- ============================== -->

    <section id="special-offers">

        <h2>
            العروض الخاصة
        </h2>

        <!--
            ALL SPECIAL OFFERS FROM SUPABASE
            WILL APPEAR HERE.
        -->

        <div id="special-offers-container"></div>

    </section>


    <!-- ============================== -->
    <!-- GO TO CART -->
    <!-- ============================== -->

    <button id="go-to-cart">
        الانتقال إلى سلة التسوق
    </button>

</div>


<!-- ============================== -->
<!-- JAVASCRIPT -->
<!-- ============================== -->

<script src="script.js"></script>

<script
    type="module"
    src="supabase.js">
</script>

<script src="auth.js"></script>

<script src="offers.js"></script>

</body>
