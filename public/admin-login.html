<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/faviconnature.png">

</head>


<body>

    <button
        id="theme-toggle"
        type="button"
        aria-label="تغيير الوضع"
    >
        🌙
    </button>


    <div class="container">

        <img
            src="images/logo.jpg"
            alt="Nature Secrets Logo"
        >

        <h1>
            Admin Login
        </h1>


        <input
            id="admin-password"
            type="password"
            placeholder="كلمة المرور"
        >


        <button
            type="button"
            id="login-button"
        >
            دخول
        </button>


        <p id="login-message"></p>

    </div>


    <script>

        const button =
            document.getElementById("login-button");

        const passwordInput =
            document.getElementById("admin-password");

        const message =
            document.getElementById("login-message");


        button.addEventListener("click", async function () {

            const password =
                passwordInput.value.trim();


            if (!password) {

                message.textContent =
                    "Please enter the password";

                return;

            }


            button.disabled = true;

            message.textContent =
                "Checking password...";


            try {

                const response =
                    await fetch("/api/admin-login", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            password: password
                        })

                    });


                const result =
                    await response.json();


                if (!response.ok || !result.success) {

                    message.textContent =
                        result.message ||
                        "Incorrect password";

                    button.disabled = false;

                    return;

                }


                sessionStorage.setItem(
                    "natureSecretsAdminToken",
                    result.token
                );


                message.textContent =
                    "Success! Opening admin panel...";


                window.location.replace(
                    "admin.html"
                );

            }


            catch (error) {

                console.error(
                    "ADMIN LOGIN ERROR:",
                    error
                );


                message.textContent =
                    "حدث خطأ أثناء تسجيل الدخول";


                button.disabled = false;

            }

        });


        passwordInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    button.click();

                }

            }
        );

    </script>


    <script src="script.js"></script>

</body>

</html>
