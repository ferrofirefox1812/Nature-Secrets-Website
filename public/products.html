<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات - Nature Secrets</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/faviconnature.png">

</button>

<button class="category-button" onclick="location.href='#hair-mask'">
    حمام الكريم
</button>

<button class="category-button" onclick="location.href='#hair-loss'">

</button>

<button class="category-button" onclick="location.href='#serum'">

</button>

</button>

<button class="category-button" onclick="location.href='#soap'">

</button>
