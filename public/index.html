<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nature Secrets</title>

    <link rel="icon" type="image/png" href="images/faviconnature.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
    rel="stylesheet">
</head>

<body class="homepage">

    <button id="theme-toggle" type="button" aria-label="تغيير الوضع">
    🌙
</button>

    <div class="container">

        <div class="shipping-message">
    🚚 شحن مجاني للطلبات فوق 1500 جنيه
</div>

    <img src="images/logo.jpg" alt="Nature Secrets Logo">

<img
    src="images/title.png"
    alt="Nature Secrets"
    class="website-title"
>

<h3 id="welcome-message"></h3>

<button id="logout-button">
    Logout
</button>

<p>الخامات التي تثقي بها, العنايه التي تحتاجيها.</p>

     <button id="offers-button">
    Offers & Bundles
</button>

        <button id="products-button">
            Products
        </button>

        <button id="cart-button">
            Shopping Cart (<span id="cart-count">0</span>)
        </button>

        <button id="my-orders-button">
    📦 طلباتي
</button>

        <button id="tracking-button">
             تتبع الطلب
        </button>

        <button id="product-info-button">
             معلومات المنتجات
        </button>

        <button id="wheel-button">
            🎡 عجلة الحظ
        </button>

        <section>

    <h2>ليه احنا الافضل?</h2>

    <ul>
        <li>خامات عاليه.</li>
        <li>امنه جدا.</li>
        <li>مجهزه في معملنا الخاص.</li>
        <li>منتجات تجميلية وعلاجية مخصصة.</li>
    </ul>

</section>


<div class="whatsapp-container">

    <p id="whatsapp-message">
        محتاج مساعدة؟
    </p>

<div id="whatsapp-arrow">

<svg width="150" height="170" viewBox="0 0 150 170">

<path
d="
M20 10
C5 35, 0 70, 35 75
C70 80, 70 35, 40 45
C15 55, 35 95, 85 100
C115 105, 120 125, 110 145
"
fill="none"
stroke="#25D366"
stroke-width="5"
stroke-linecap="round"
/>

<path
d="
M112 147
L102 132
M112 147
L122 132
"
fill="none"
stroke="#25D366"
stroke-width="5"
stroke-linecap="round"
/>

</svg>

</div>

    <a
        href="https://wa.me/201005670318"
        target="_blank"
        class="floating-whatsapp-button"
    >

        <img
        src="images/whatsapp.png"
        alt="WhatsApp">

        <span>
            WhatsApp
        </span>

    </a>

</div>



<div id="auth-popup" class="auth-popup">

    <div class="auth-box">

        <h2>مرحباً بك في Nature Secrets</h2>

         <input
        type="text"
        id="auth-name"
        placeholder="الاسم">

        <input
        type="email"
        id="auth-email"
        placeholder="البريد الإلكتروني">

        <input
        type="password"
        id="auth-password"
        placeholder="كلمة المرور">

        <button id="signin-button">

            تسجيل الدخول

        </button>

        <button id="signup-button">

            إنشاء حساب

        </button>

    </div>

</div>

<div id="missing-name-popup" class="auth-popup" style="display:none;">

    <div class="auth-box">

        <h2>من فضلك أدخل اسمك</h2>

        <input
        type="text"
        id="missing-name-input"
        placeholder="الاسم">

        <button id="save-missing-name">
            حفظ
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="script.js"></script>
<script type="module" src="supabase.js"></script>
<script src="auth.js"></script>

<p id="website-version">v1.8</p>

<img src="images/botanical.png" alt="" class="botanical-decoration">

</body>
</html>
